name: Deploy NodeJS to ECR and EC2

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 192497948979.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: nodejs-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest

      - name: Push Docker Image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 192497948979.dkr.ecr.us-east-1.amazonaws.com

            docker pull 192497948979.dkr.ecr.us-east-1.amazonaws.com/nodejs-app:dev-latest

            docker stop nodejs-app-dev || true
            docker rm nodejs-app-dev || true

            docker run -d \
              --restart always \
              --name nodejs-app-dev \
              -p 9000:9000 \
              192497948979.dkr.ecr.us-east-1.amazonaws.com/nodejs-app:dev-latest

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker ps
            docker logs --tail 50 nodejs-app-dev || true
